version: 1
id: clients
nom: Clients
champ_titre: nom
colonnes:
  - { cle: nom, nom: Nom, type: text }
  - cle: secteur
    nom: Secteur
    type: select
    options:
      - { label: Industrie, couleur: bleu }
      - { label: Commerce, couleur: orange }
      - { label: Services, couleur: violet }
  - { cle: projets, nom: Projets, type: relation, cible: projets, proprietaire: false, inverse: client }
  - { cle: nb_projets, nom: Nb projets, type: rollup, relation: projets, champ: titre, calcul: compter }
  # Rollup de rollup : somme des heures des projets, elles-mêmes somme des heures des tâches.
  - { cle: heures, nom: Heures, type: rollup, relation: projets, champ: heures, calcul: somme }
  - { cle: avancement, nom: Avancement moyen, type: rollup, relation: projets, champ: avancement, calcul: moyenne }
vues: [ cartes, tableau ]
