version: 1
id: projets
nom: Projets
champ_titre: titre
colonnes:
  - { cle: titre, nom: Titre, type: text }
  - cle: statut
    nom: Statut
    type: select
    options:
      - { label: À faire, couleur: gris }
      - { label: En cours, couleur: bleu }
      - { label: Terminé, couleur: vert }
  - { cle: client, nom: Client, type: relation, cible: clients, proprietaire: true, inverse: projets }
  - { cle: debut, nom: Début, type: date }
  - { cle: echeance, nom: Échéance, type: date }
  - { cle: revue, nom: Revue client, type: date }
  - { cle: budget, nom: Budget, type: number }
  - { cle: taches, nom: Tâches, type: relation, cible: taches, proprietaire: false, inverse: projet }
  - { cle: heures, nom: Heures, type: rollup, relation: taches, champ: heures, calcul: somme }
  - { cle: avancement, nom: Avancement, type: rollup, relation: taches, champ: fait, calcul: pourcent_coches }
  - cle: restantes
    nom: Tâches restantes
    type: rollup
    relation: taches
    champ: fait
    calcul: compter
    filtre: { operateur: egal, valeur: false }
  - { cle: jours_restants, nom: Jours restants, type: formula, expression: 'si(prop("statut") == "Terminé", 0, ecart_jours(aujourdhui(), prop("echeance")))' }
  - { cle: taux, nom: Budget par heure, type: formula, expression: 'arrondi(prop("budget") / prop("heures"), 0)' }
vues: [ tableau, par-statut, planning ]
