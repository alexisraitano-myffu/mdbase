[package]
name = "mdbase"
version = "1.1.1"
description = "Bases de données façon Notion, stockées dans un dossier de fichiers Markdown + YAML."
license = "MIT"
repository = "https://github.com/alexisraitano-myffu/mdbase"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mdbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
